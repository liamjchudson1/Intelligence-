[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "culturalintel"
version = "0.1.0"
description = "Autonomous cultural intelligence platform - monitor, analyse, and report on emerging cultural signals"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "praw>=7.7",
    "tweepy>=4.14",
    "aiohttp>=3.9",
    "apscheduler>=3.10",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "httpx>=0.27",
    "structlog>=24.1",
    "python-dotenv>=1.0",
    "beautifulsoup4>=4.12",
    "markdown>=3.5",
]

[project.optional-dependencies]
dashboard = ["fastapi>=0.109", "uvicorn>=0.27", "jinja2>=3.1"]
email = ["httpx>=0.27"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.2"]

[project.scripts]
culturalintel = "culturalintel.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
